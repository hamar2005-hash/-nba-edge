name: Generate daily NBA Edge projections

on:
  schedule:
    - cron: "0 10,16,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  projections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore trained models
        run: |
          mkdir -p models
          python - <<'PY'
          from pathlib import Path
          import zipfile
          bundle = Path("NBA_Trained_Models.zip")
          if not bundle.exists():
              raise SystemExit("NBA_Trained_Models.zip is missing")
          with zipfile.ZipFile(bundle) as z:
              z.extractall(".")
          required = [
              Path("models/points_model.joblib"),
              Path("models/rebounds_model.joblib"),
              Path("models/assists_model.joblib"),
              Path("models/latest_player_features.csv"),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("Model bundle is missing: " + ", ".join(missing))
          PY
      - name: Generate today's projections and archive the previous slate
        run: python auto_daily.py --out data/daily_predictions.csv
      - name: Generate first-basket scorer rankings
        run: |
          if [ -f data/first_basket_player_history.csv ]; then
            python first_basket.py --mode predict
          else
            echo "First-basket history is not ready yet; weekly data collection will build it."
          fi
      - name: Settle yesterday's completed games
        run: python settle_results.py
      - name: Commit projections and accuracy history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_predictions.csv data/first_basket_predictions.csv data/prediction_history.csv data/settled_results.csv
          git diff --cached --quiet || git commit -m "Update NBA projections and accuracy history"
          git push
