name: UFC live-source data audit

on:
  workflow_dispatch:
  push:
    branches: [ufc-data-audit-improvements]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      - name: Download and audit UFC source feeds
        run: python scripts/audit_ufc_sources.py
      - name: Upload audit report and source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufc-live-source-audit
          path: artifacts/ufc_data_audit/
          if-no-files-found: warn
