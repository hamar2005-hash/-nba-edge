name: UFC model checks

on:
  push:
    paths:
      - "ufc_model.py"
      - "tests/**"
      - ".github/workflows/ufc-model-checks.yml"
  pull_request:
    paths:
      - "ufc_model.py"
      - "tests/**"
      - ".github/workflows/ufc-model-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run UFC regression tests
        run: python -m unittest discover -s tests -v
