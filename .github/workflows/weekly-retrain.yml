name: Weekly NBA Edge model improvement

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      market:
        description: "Model to retrain"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - points
  push:
    branches: [points-v2-minutes-model]
    paths:
      - "weekly_retrain.py"
      - "points_v2.py"
      - "train_models.py"
      - "collect_nba_data.py"
      - ".github/workflows/weekly-retrain.yml"
  pull_request:
    branches: [main]
    paths:
      - "weekly_retrain.py"
      - "points_v2.py"
      - "train_models.py"
      - "collect_nba_data.py"
      - ".github/workflows/weekly-retrain.yml"

permissions:
  contents: write

concurrency:
  group: nba-edge-weekly-retraining
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore season archive cache
        uses: actions/cache@v4
        with:
          path: data/season_cache
          key: nba-player-logs-hf-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nba-player-logs-hf-v1-${{ runner.os }}-${{ github.ref_name }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow>=15
      - name: Restore current production models
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          bundle = Path("NBA_Trained_Models.zip")
          if not bundle.exists():
              raise SystemExit("NBA_Trained_Models.zip is missing")
          with zipfile.ZipFile(bundle) as archive:
              archive.extractall(".")
          required = [Path(f"models/{m}_model.joblib") for m in ("points", "rebounds", "assists")]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("Current model bundle is incomplete: " + ", ".join(missing))
          PY
      - name: Collect historical player game logs
        run: python collect_nba_data.py --start-season 2021-22 --end-season 2025-26 --current-season 2026-27 --out data/player_game_logs.csv
      - name: Train and validate candidates
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.market }}" = "points" ]; then
            python weekly_retrain.py --market points
          else
            python weekly_retrain.py --market all
          fi
      - name: Upload Points V2 backtest report
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: points-v2-backtest-report
          path: models/weekly_retrain_report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Package current accepted models
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          required = sorted(str(p) for p in Path("models").glob("*_model.joblib")) + [
              "models/latest_player_features.csv",
              "models/weekly_retrain_report.json",
              "models/latest_team_defense.csv",
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit("Cannot package incomplete models: " + ", ".join(missing))
          with zipfile.ZipFile("NBA_Trained_Models.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in required:
                  archive.write(path, path)
          PY
      - name: Commit updated data, models and report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models NBA_Trained_Models.zip
          for file in data/player_game_logs.csv data/first_basket_games.csv data/first_basket_player_history.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git diff --cached --quiet || git commit -m "Weekly validated NBA model update"
          git pull --rebase origin main
          git push
