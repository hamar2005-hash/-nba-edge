name: UFC method and rounds validation
on:
  workflow_dispatch:
  push:
    branches: [ufc-data-audit-improvements]
    paths:
      - 'ufc_model.py'
      - 'pages/3_UFC_Edge.py'
      - 'scripts/validate_ufc_aux_models.py'
      - '.github/workflows/ufc-auxiliary-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests
      - run: python scripts/validate_ufc_aux_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-auxiliary-validation
          path: artifacts/ufc_auxiliary_validation.json
